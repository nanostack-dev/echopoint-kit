name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Lint and tests are Dagger checks from official modules (dagger.toml):
# `dagger check` runs them the same way on a laptop and here. This public
# repository stays on GitHub-hosted runners, so each run starts a cold engine.
env:
  DAGGER_VERSION: v1.0.0-beta.24
  DAGGER_ENGINE: image://registry.dagger.io/engine:v1.0.0-beta.24
  DAGGER_NO_NAG: '1'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install the Dagger CLI
        run: ./scripts/ci/install-dagger.sh "$RUNNER_TEMP/dagger-bin"
      - name: Run every check
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/dagger-bin:$PATH"
          dagger check --progress=report
