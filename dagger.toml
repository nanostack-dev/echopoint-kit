# echopoint-kit's CI as Dagger checks, from official modules only. `dagger check`
# runs them the same way on a laptop and in CI (.github/workflows/ci.yml).
[modules.go]
source = "dagger.io/go"

[modules.go.settings]
# As the old workflow ran them: the race detector, no test cache.
goflags = "-race -count=1"
# The race detector needs cgo, so the base has a C toolchain.
base = "golang:1.26.5-bookworm"

[modules.golangci-lint]
source = "dagger.io/go/golangci-lint"
