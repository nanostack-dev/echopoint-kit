openapi: 3.0.3
info:
  title: Indentless
  version: 1.0.0
paths:
  /pets:
    get:
      tags:
      - pets
      - animals
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        "200":
          description: OK
components:
  schemas:
    Pet:
      type: object
      required:
      - name
      - age
      properties:
        name:
          type: string
        age:
          type: integer
        kind:
          type: string
          enum:
          - cat
          - dog
